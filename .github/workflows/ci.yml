name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python:
    name: Windows Python 3.14
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run complete regression suite
        run: python -B -m unittest discover -s tests -v

      - name: Validate JSON schemas
        run: >-
          python -c "import json; from pathlib import Path; from jsonschema import Draft202012Validator;
          files=sorted(Path('schemas').glob('*.json'));
          [Draft202012Validator(json.loads(path.read_text(encoding='utf-8'))).check_schema(json.loads(path.read_text(encoding='utf-8'))) for path in files];
          print(f'validated {len(files)} schemas')"

      - name: Run standard-library synthetic discovery
        run: python -S -B mining_kernel.py --workspace examples/synthetic_workspace discover

      - name: Run standard-library synthetic validation
        run: python -S -B mining_kernel.py --workspace examples/synthetic_workspace validate

      - name: Inspect read-only Zotero boundary
        run: >-
          python -B mining_kernel.py --workspace examples/synthetic_workspace
          inspect-source zotero_mcp_readonly --operation zotero_get_collections
